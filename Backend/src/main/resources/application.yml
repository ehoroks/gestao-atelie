spring:
  application:
    name: cirinha-atelie
  datasource:
    # Desenvolvimento local por padrao. No Supabase, defina DB_JDBC_URL,
    # DB_USERNAME e DB_PASSWORD como variaveis de ambiente (nunca no Git).
    # Use sempre sslmode=require no Supabase.
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/cirinha_atelie}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: atelie-pool
      # Limites conservadores: funcionam no Postgres local e no pooler do Supabase.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DB_KEEPALIVE_MS:300000}
  jpa:
    hibernate:
      # O schema e responsabilidade exclusiva do Flyway.
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    # O Supabase pode estar retomando a instancia (free tier pausado).
    connect-retries: ${DB_CONNECT_RETRIES:5}
    connect-retries-interval: ${DB_CONNECT_RETRIES_INTERVAL:10s}

# /actuator/health inclui o status do banco e serve como smoke test do Supabase.
# /actuator/health/readiness e /actuator/health/liveness ficam disponiveis para deploy.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# No Supabase, informe a URL JDBC do pooler com sslmode=require.
# Nao armazenar senhas, chaves ou tokens em arquivos versionados.
