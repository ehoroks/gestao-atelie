spring:
  datasource:
    url: jdbc:h2:mem:atelie;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never

# Segredo fixo apenas para testes locais/CI. Nao usar em producao.
app:
  security:
    jwt:
      secret: segredo-de-teste-com-mais-de-32-caracteres-para-hs256
      expiration-minutes: 60
